<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" width="360" height="394" role="img" aria-label="Agentic NetOps incident loop: detect from CloudTrail, prove the drift against the baseline, measure reachability, plan a policy-gated repair, route it by risk tier (low runs after a 60 s veto, medium needs one approval, high needs two approvers), execute with scoped STS credentials, verify by re-diffing. Every decision lands in a hash-chained ledger."><title>Agentic NetOps incident loop: detect from CloudTrail, prove the drift against the baseline, measure reachability, plan a policy-gated repair, route it by risk tier (low runs after a 60 s veto, medium needs one approval, high needs two approvers), execute with scoped STS credentials, verify by re-diffing. Every decision lands in a hash-chained ledger.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;text-anchor:middle}.t{font-size:12px;font-weight:600;fill:#f3ebff}.c{font-size:10px;fill:#b8a6e6}.k{font-size:9px;font-weight:700;letter-spacing:.06em;text-anchor:start}.a{font-size:10px;fill:#f3ebff;text-anchor:start}.box{fill:#26184d;stroke:#4a3486}.ln{fill:none;stroke:#5ff3ff;stroke-width:1.5;stroke-linejoin:round}.tick{stroke:#4a3486;stroke-dasharray:2 3}.l{text-anchor:start}.m{text-anchor:middle}.r{text-anchor:end}</style><defs><marker id="ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5ff3ff"/></marker></defs><rect width="360" height="394" rx="12" fill="#1b1236"/><path d="M347 29H353" class="tick"/><path d="M347 73H353" class="tick"/><path d="M347 117H353" class="tick"/><path d="M347 161H353" class="tick"/><path d="M347 217H353" class="tick"/><path d="M347 271H353" class="tick"/><path d="M347 315H353" class="tick"/><path d="M347 362H353" class="tick"/><path d="M353 29V362" class="tick"/><rect x="14" y="344" width="332" height="36" rx="10" fill="#140d2a" stroke="#3a2a6e"/><text x="180" y="359" class="c">every decision lands in a hash-chained ledger</text><text x="180" y="372" class="c">in DynamoDB, its head anchored out of band</text><rect x="14" y="14" width="332" height="30" rx="6" class="box"/><text x="26" y="33" class="t l">Detect</text><text x="334" y="33" class="c r">CloudTrail</text><path d="M180 45V57" class="ln" marker-end="url(#ah)"/><rect x="14" y="58" width="332" height="30" rx="6" class="box"/><text x="26" y="77" class="t l">Prove</text><text x="334" y="77" class="c r">vs baseline</text><path d="M180 89V101" class="ln" marker-end="url(#ah)"/><rect x="14" y="102" width="332" height="30" rx="6" class="box"/><text x="26" y="121" class="t l">Measure</text><text x="334" y="121" class="c r">reachability</text><path d="M180 133V145" class="ln" marker-end="url(#ah)"/><rect x="14" y="146" width="332" height="30" rx="6" class="box"/><text x="26" y="165" class="t l">Repair</text><text x="334" y="165" class="c r">policy gate</text><path d="M180 177V190M66 190H294M66 242H294" class="ln"/><text x="186" y="186" class="c l">risk tier</text><path d="M66 190V201" class="ln" marker-end="url(#ah)"/><rect x="14" y="202" width="104" height="30" rx="8" fill="#1f1442" stroke="#5ff3ff"/><text x="66" y="214" class="k m" fill="#5ff3ff">LOW</text><text x="66" y="226" class="a m">60 s veto</text><path d="M66 233V242" class="ln"/><path d="M180 190V201" class="ln" marker-end="url(#ah)"/><rect x="128" y="202" width="104" height="30" rx="8" fill="#1f1442" stroke="#ffd36b"/><text x="180" y="214" class="k m" fill="#ffd36b">MED</text><text x="180" y="226" class="a m">1 approval</text><path d="M180 233V242" class="ln"/><path d="M294 190V201" class="ln" marker-end="url(#ah)"/><rect x="242" y="202" width="104" height="30" rx="8" fill="#1f1442" stroke="#ff5ad9"/><text x="294" y="214" class="k m" fill="#ff5ad9">HIGH</text><text x="294" y="226" class="a m">2 approvers</text><path d="M294 233V242" class="ln"/><path d="M180 242V255" class="ln" marker-end="url(#ah)"/><rect x="14" y="256" width="332" height="30" rx="6" class="box"/><text x="26" y="275" class="t l">Execute</text><text x="334" y="275" class="c r">scoped STS</text><path d="M180 287V299" class="ln" marker-end="url(#ah)"/><rect x="14" y="300" width="332" height="30" rx="6" class="box"/><text x="26" y="319" class="t l">Verify</text><text x="334" y="319" class="c r">re-diff</text></svg>
