<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160" role="img" aria-label="Agentic NetOps incident loop: detect from CloudTrail, prove the drift against the baseline, measure reachability, plan a policy-gated repair, route it by risk tier (low runs after a 60 s veto, medium needs one approval, high needs two approvers), execute with scoped STS credentials, verify by re-diffing. Every decision lands in a hash-chained ledger."><title>Agentic NetOps incident loop: detect from CloudTrail, prove the drift against the baseline, measure reachability, plan a policy-gated repair, route it by risk tier (low runs after a 60 s veto, medium needs one approval, high needs two approvers), execute with scoped STS credentials, verify by re-diffing. Every decision lands in a hash-chained ledger.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;text-anchor:middle}.t{font-size:12px;font-weight:600;fill:#fbeed8}.c{font-size:10px;fill:#c9b3d6}.k{font-size:9px;font-weight:700;letter-spacing:.06em;text-anchor:start}.a{font-size:10px;fill:#fbeed8;text-anchor:start}.box{fill:#3d2c48;stroke:#5d4569}.ln{fill:none;stroke:#f6b077;stroke-width:1.5;stroke-linejoin:round}.tick{stroke:#5d4569;stroke-dasharray:2 3}</style><defs><marker id="ah" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f6b077"/></marker></defs><rect width="840" height="160" rx="12" fill="#2b2336"/><path d="M61 88V117" class="tick"/><path d="M161 88V117" class="tick"/><path d="M261 88V117" class="tick"/><path d="M361 88V117" class="tick"/><path d="M444 91V117" class="tick"/><path d="M553 104V117" class="tick"/><path d="M679 88V117" class="tick"/><path d="M779 88V117" class="tick"/><rect x="18" y="120" width="804" height="22" rx="11" fill="#231b2b" stroke="#4b3a57"/><text x="420" y="135" class="c">every decision lands in a hash-chained ledger in DynamoDB, its head anchored out of band</text><rect x="18" y="39" width="86" height="46" rx="6" class="box"/><text x="61" y="59" class="t">Detect</text><text x="61" y="75" class="c">CloudTrail</text><path d="M105 62H117" class="ln" marker-end="url(#ah)"/><rect x="118" y="39" width="86" height="46" rx="6" class="box"/><text x="161" y="59" class="t">Prove</text><text x="161" y="75" class="c">vs baseline</text><path d="M205 62H217" class="ln" marker-end="url(#ah)"/><rect x="218" y="39" width="86" height="46" rx="6" class="box"/><text x="261" y="59" class="t">Measure</text><text x="261" y="75" class="c">reachability</text><path d="M305 62H317" class="ln" marker-end="url(#ah)"/><rect x="318" y="39" width="86" height="46" rx="6" class="box"/><text x="361" y="59" class="t">Repair</text><text x="361" y="75" class="c">policy gate</text><path d="M405 62H417" class="ln" marker-end="url(#ah)"/><path d="M418 62L444 36L470 62L444 88z" fill="#3d2c48" stroke="#b79cf0"/><text x="444" y="60" class="c">risk</text><text x="444" y="72" class="c">tier</text><path d="M471 62H482V34H493" class="ln" marker-end="url(#ah)"/><rect x="494" y="23" width="118" height="22" rx="11" fill="#33263d" stroke="#7fd6b0"/><text x="504" y="37.5" class="k" fill="#7fd6b0">LOW</text><text x="538" y="37.5" class="a">60 s veto</text><path d="M613 34H624V62" class="ln"/><path d="M471 62H482V62H493" class="ln" marker-end="url(#ah)"/><rect x="494" y="51" width="118" height="22" rx="11" fill="#33263d" stroke="#f6b077"/><text x="504" y="65.5" class="k" fill="#f6b077">MED</text><text x="538" y="65.5" class="a">1 approval</text><path d="M613 62H624V62" class="ln"/><path d="M471 62H482V90H493" class="ln" marker-end="url(#ah)"/><rect x="494" y="79" width="118" height="22" rx="11" fill="#33263d" stroke="#f58ea8"/><text x="504" y="93.5" class="k" fill="#f58ea8">HIGH</text><text x="538" y="93.5" class="a">2 approvers</text><path d="M613 90H624V62" class="ln"/><path d="M624 62H635" class="ln" marker-end="url(#ah)"/><rect x="636" y="39" width="86" height="46" rx="6" class="box"/><text x="679" y="59" class="t">Execute</text><text x="679" y="75" class="c">scoped STS</text><path d="M723 62H735" class="ln" marker-end="url(#ah)"/><rect x="736" y="39" width="86" height="46" rx="6" class="box"/><text x="779" y="59" class="t">Verify</text><text x="779" y="75" class="c">re-diff</text></svg>
